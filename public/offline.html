<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta id="theme-color" name="theme-color" content="#7C3AED" />
    <title>Aplicativo — Sem conexão</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Montserrat, Inter, system-ui, sans-serif;
        --brand: #7c3aed;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #241442;
        background:
          radial-gradient(
            circle at 80% 10%,
            color-mix(in srgb, var(--brand) 20%, transparent),
            transparent 36%
          ),
          radial-gradient(
            circle at 5% 90%,
            color-mix(in srgb, var(--brand) 13%, transparent),
            transparent 38%
          ),
          #f7f4ff;
      }
      main {
        width: min(100%, 420px);
        padding: 34px;
        text-align: center;
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(108, 59, 255, 0.13);
        border-radius: 28px;
        box-shadow: 0 24px 80px rgba(55, 25, 120, 0.14);
        backdrop-filter: blur(18px);
      }
      img {
        width: 92px;
        height: 92px;
        border-radius: 24px;
        box-shadow: 0 14px 35px rgba(66, 31, 155, 0.22);
      }
      h1 {
        margin: 24px 0 10px;
        font-size: 24px;
      }
      p {
        margin: 0;
        color: #66547d;
        line-height: 1.6;
      }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 14px;
        padding: 13px 20px;
        color: white;
        background: linear-gradient(
          135deg,
          var(--brand),
          color-mix(in srgb, var(--brand) 66%, black)
        );
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img id="app-icon" src="/icons/marcia-app.svg" alt="" />
      <h1>Você está sem conexão</h1>
      <p id="offline-copy">
        O aplicativo precisa de internet para atualizar seus dados financeiros e conversar com a
        assistente com segurança.
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
    <script>
      (() => {
        try {
          const cached = JSON.parse(localStorage.getItem("clone-brand-cache") || "null");
          if (!cached || typeof cached !== "object") return;
          const name =
            typeof cached.name === "string" && cached.name.trim()
              ? cached.name.trim().slice(0, 60)
              : "Aplicativo";
          const color =
            typeof cached.primary === "string" && /^#[0-9a-f]{6}$/i.test(cached.primary)
              ? cached.primary
              : "#7C3AED";
          const rawIcon =
            typeof cached.iconUrl === "string" && cached.iconUrl.trim()
              ? cached.iconUrl.trim()
              : typeof cached.logoUrl === "string"
                ? cached.logoUrl.trim()
                : "";
          const icon =
            /^\/(?!\/)/.test(rawIcon) || /^https:\/\//i.test(rawIcon)
              ? rawIcon
              : "/icons/marcia-app.svg";
          document.title = `${name} — Sem conexão`;
          document.documentElement.style.setProperty("--brand", color);
          document.querySelector("#theme-color")?.setAttribute("content", color);
          document.querySelector("#app-icon")?.setAttribute("src", icon);
          const copy = document.querySelector("#offline-copy");
          if (copy)
            copy.textContent = `${name} precisa de internet para atualizar seus dados financeiros e conversar com a assistente com segurança.`;
        } catch {}
      })();
    </script>
  </body>
</html>
